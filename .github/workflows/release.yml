name: Release packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  package:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            extension: dmg
          - runner: macos-15-intel
            platform: mac
            arch: x64
            extension: dmg
          - runner: windows-latest
            platform: win
            arch: x64
            extension: exe
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            extension: AppImage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check release tag matches package version
        shell: bash
        run: node --input-type=module -e 'import p from "./package.json" with { type:"json" }; if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Tag must match package.json version");'
      - run: npm ci
      - run: npm run build
      # electron-builder does not upload here: two macOS runners would each upload a latest-mac.yml for one
      # architecture, and the second would replace the first. The publish job below joins them and uploads everything.
      - name: Package without signing
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never --config electron-builder.yml
      # The installers, their blockmaps (for downloading only the changed parts) and latest*.yml (what installed apps read).
      - uses: actions/upload-artifact@v4
        with:
          name: endurance-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.${{ matrix.extension }}
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  # One GitHub Release per tag. Installed apps read its latest*.yml to find a newer version.
  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Join the two macOS update files
        run: node scripts/merge-mac-update-info.mjs packages/*-mac-arm64/latest-mac.yml packages/*-mac-x64/latest-mac.yml > latest-mac.yml
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Endurance $GITHUB_REF_NAME" --generate-notes
          packages/*/*.dmg packages/*/*.zip packages/*/*.exe packages/*/*.AppImage packages/*/*.blockmap
          packages/*/latest.yml packages/*/latest-linux.yml latest-mac.yml
