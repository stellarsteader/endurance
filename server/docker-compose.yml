# The manager; model containers are started by it on the same network (server/manager/containers.py).
name: endurance
services:
  manager:
    build: .
    image: endurance-vllm-manager:1
    restart: unless-stopped
    env_file: .env
    environment:
      HF_HOME: /hf
      STATE_DIR: /state
      DOCKER_NETWORK: endurance
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_HF_HOME}:/hf
      - ./state:/state
    # Loopback only: other devices come in through Tailscale Serve (install.sh). Docker's rules for published ports
    # come before ufw's, so this address, not the firewall, is what keeps the port off the network.
    ports:
      - "127.0.0.1:${PORT:-8100}:8100"
    networks: [endurance]
networks:
  endurance:
    name: endurance
